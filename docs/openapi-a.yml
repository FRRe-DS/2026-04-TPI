openapi: 3.1.0

info: 
  title: DS 2026 API - Contratos de M4 
  description: |
    Todos los contratos del GA del G4.

    No se definen endpoints en esta entrega.

  version: 1.0.0

paths: {}

components:
  securitySchemes:
    tokenM1:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso emitido por M1.

  schemas:
    # Identidad autenticada obtenida a partir del token validado.
    IdentidadAutenticada:
      type: object
      additionalProperties: false
      required:
        - identidad_id
      properties:
        identidad_id:
          type: string
          description: |
            Identificador estable del usuario autenticado,
            obtenido del token validado por M1.

    # Consulta que M5 necesita realizar a M2.
    ConsultaCliente:
      type: object
      additionalProperties: false
      required:
        - identidad_id
      properties:
        identidad_id:
          type: string
          description: |
            Identificador de identidad que M2 utiliza
            para localizar el perfil correspondiente.

    DatosCliente:
      type: object
      additionalProperties: false
      required:
        - cliente_id
        - nombre

      properties:
        cliente_id:
          type: string
          format: uuid
          description: Identificador único del cliente gestionado por M2.

        nombre:
          type: string
          minLength: 1
          description: Nombre del cliente asociado al identificador consultado.

    ConsultaReserva:
      type: object
      additionalProperties: false
      required:
        - identidad_id
      properties:
        identidad_id:
          type: string
          description: Identificador estable de la identidad del cliente.



