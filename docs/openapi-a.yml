openapi: 3.1.0

info: 
  title: DS 2026 API - Contratos de M5 
  description: |
    Todos los contratos del GA del G4.

    No se definen endpoints en esta entrega.

  version: 1.0.0

paths: {
  /solicitudes:
      post:
        summary: Crear una solicitud de viaje
        description: Registra una nueva solicitud con estado PENDIENTE.

        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitud"  

        responses:
          "201":
            description: Solicitud creada correctamente
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Solicitud_Creada"

          "422":
            description: Error de validación de los datos enviados
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorDatosRecibidos"
  /ofertas/:
    post:
      summary: Crear oferta con expiracion (RF 5.4)
      description: Registra una nueva oferta enviada a un conductor asignando una fecha de expiracion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_solicitud
                - conductor_id
                - tiempo_expiracion_seg
              properties:
                id_solicitud:
                  type: string
                  format: uuid
                  description: ID de la solicitud asociada
                conductor_id:
                  type: string
                  format: uuid
                  description: ID del conductor destinatario
                tiempo_expiracion_seg:
                  type: integer
                  minimum: 1
                  default: 30
                  description: Tiempo en segundos para que la oferta expire
      responses:
        "201":
          description: Oferta creada con exito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Oferta"
        "422":
          description: Error de validacion en los datos enviados
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object

  /ofertas/{id_oferta}/respuesta:
    patch:
      summary: Aceptar o rechazar una oferta de conductor (RF 5.5)
      description: >
        Permite al cliente dueño de la solicitud aceptar o rechazar una oferta
        PENDIENTE de un conductor. Al aceptar, la solicitud pasa a ACEPTADA.
        Al rechazar, la solicitud vuelve a PENDIENTE para nueva asignación.
        En ambos casos se registra el cambio en el historial de despacho.
      parameters:
        - name: id_oferta
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID único de la oferta a responder

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cliente_id
                - accion
              properties:
                cliente_id:
                  type: string
                  format: uuid
                  description: ID del cliente dueño de la solicitud
                accion:
                  type: string
                  enum:
                    - ACEPTAR
                    - RECHAZAR
                  description: Acción a tomar sobre la oferta

      responses:
        "200":
          description: Oferta respondida correctamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - id_oferta
                  - id_solicitud
                  - estado_oferta
                  - estado_solicitud
                  - mensaje
                properties:
                  id_oferta:
                    type: string
                    format: uuid
                  id_solicitud:
                    type: string
                    format: uuid
                  estado_oferta:
                    type: string
                    enum:
                      - ACEPTADA
                      - RECHAZADA
                  estado_solicitud:
                    type: string
                    enum:
                      - ACEPTADA
                      - PENDIENTE
                  mensaje:
                    type: string

        "403":
          description: El cliente no es el dueño de la solicitud asociada
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

        "404":
          description: Oferta o solicitud no encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

        "409":
          description: La oferta ya fue respondida anteriormente
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

        "422":
          description: Error de validación de los datos enviados
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      properties:
                        loc:
                          type: array
                          items:
                            type:
                              - string
                              - integer
                        msg:
                          type: string
                        type:
                          type: string
}

components:

  schemas:
  
    # Consulta que M5 necesita realizar a M2.
    ConsultaCliente:
      type: object
      additionalProperties: false
      required:
        - Email
      properties:
        Email:
          type: string
          description: |
            Identificador de identidad que M2 utiliza
            para localizar el perfil correspondiente.

    DatosCliente:
      type: object
      additionalProperties: false
      required:
        - cliente_id
        - nombre_cliente

      properties:
        cliente_id:
          type: string
          format: uuid
          description: Identificador único del cliente gestionado por M2.

        nombre_cliente:
          type: string
          minLength: 1
          description: Nombre del cliente asociado al identificador consultado.

    ConsultaReserva:
      type: object
      additionalProperties: false
      required:
        - identidad_id
      properties:
        identidad_id:
          type: string
          description: Identificador estable de la identidad del cliente.

# formato de la solicitud
    Solicitud:
          type: object
          additionalProperties: false
          required:
            - solicitud_id
            - cliente_id
            - nombre_cliente
            - conductor_id  #Mantendría Solicitud como concepto central del Grupo A, pero corregiría los campos obligatorios y dejaría conductor_id opcional mientras no exista una asignación.
            - nombre_conductor
            - origen_latitud #ver como tratar las ubicaciones.
            - origen_longitud
            - destino_latitud
            - destino_longitud
            - tipo_vehiculo
            - estado

          properties:
            solicitud_id:
              type: string
              format: uuid
              description: Identificador de la solicitud creada por M5.
            
            cliente_id:
              type: string
              format: uuid
              description: Identificador del cliente que realizó la solicitud.
            
            nombre_cliente:
              type: string
              minLength: 1
              description: Nombre del cliente que realizó la solicitud.

            conductor_id:
              type: 
              - string
              - "null"
              format: uuid
              description: Identificador del conductor que aceptó la solicitud.

            nombre_conductor:
              type: 
              - string
              - "null"
              minLength: 1
              description: Nombre del conductor que aceptó la solicitud.

            origen_latitud:
              type: number
              format: float
              description: Latitud de la ubicación actual del cliente.

            origen_longitud:
              type: number
              format: float
              description: Longitud de la ubicación actual del cliente.

            destino_latitud:
              type: number
              format: float
              description: Latitud del destino del cliente.

            destino_longitud:
              type: number
              format: float
              description: Longitud del destino del cliente.

            tipo_vehiculo:
              $ref: '#/components/schemas/TipoVehiculo'
            
            estado:
              type: string
              description: | 
                Estado de la solicitud. puede ser uno de los siguientes valores:
                - pendiente: La solicitud fue creada y está esperando asignación
                - finalizada: El viaje fue completado 
                - buscando: Se están ofreciendo ofertas a conductores
                - asignada: Un conductor aceptó y ganó
                - cancelada: La canceló el cliente
                - sin_disponibilidad: La búsqueda se agotó y no hay conductor

# Solicitud de G1 a G2 para obtener los datos del conductor que aceptó la solicitud.
    SolicitarDatosConductor:
      type: object
      additionalProperties: false
      required:
        - solicitud_id
        - origen
        - destino
        - tipo_vehiculo

      properties:
        solicitud_id:
          $ref: '#/components/schemas/Solicitud/properties/solicitud_id'

        origen:
          type: object
          additionalProperties: false
          required:
            - latitud
            - longitud

          properties:
            latitud:
              $ref: '#/components/schemas/Solicitud/properties/origen_latitud'

            longitud:
              $ref: '#/components/schemas/Solicitud/properties/origen_longitud'

        destino:
          type: object
          additionalProperties: false
          required:
            - latitud
            - longitud

          properties:
            latitud:
              $ref: '#/components/schemas/Solicitud/properties/destino_latitud'

            longitud:
              $ref: '#/components/schemas/Solicitud/properties/destino_longitud'

        tipo_vehiculo:
          $ref: '#/components/schemas/Solicitud/properties/tipo_vehiculo'

# lo que nos devuelve el G2 con los datos del conductor que aceptó la solicitud.
    DatosConductor:
      type: object
      additionalProperties: false
      required:
        - conductor_id
        - nombre_conductor

      properties:
        conductor_id:
          type: string
          format: uuid
          description: Identificador único del conductor gestionado por M3.

        nombre_conductor:
          type: string
          minLength: 1
          description: Nombre del conductor asociado al identificador consultado.

        tipo_vehiculo:
          $ref: '#/components/schemas/TipoVehiculo'

    TipoVehiculo:
      type: string
      enum:
        - AUTO
        - MOTO

    Solicitud_Creada: 
      type: object
        required:
          - mensaje
          - solicitud_id
          - estado
        properties:
          mensaje:
            type: string
          solicitud_id:
            type: string
            format: uuid
          estado:
            type: string
            enum:
              - PENDIENTE

    ErrorDatosRecibidos:
      type: object
        required:
          - detail
        properties:
          detail:
            type: array
            items:
              type: object
              required:
                - loc
                - msg
                - type
              properties:
                loc:
                  type: array
                  items:
                    type:
                      - string
                      - integer
                msg:
                  type: string
                type:
                  type: string
                input:
                  description: Valor recibido que produjo el error