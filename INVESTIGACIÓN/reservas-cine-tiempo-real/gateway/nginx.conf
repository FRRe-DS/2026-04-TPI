events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $uri excluye los argumentos de consulta donde viaja el JWT.
    log_format rutas '$remote_addr "$request_method $uri" $status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log rutas;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 10m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    map $http_authorization $token_presente {
        default         0;
        "~^Bearer .+"   1;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $status $reintentar_en {
        default '';
        429     5;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
        add_header Retry-After $reintentar_en always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;

        location = /health {
            default_type application/json;
            return 200 '{"estado":"ok"}';
        }

        location = /api/funciones/health {
            proxy_pass http://servicio-funciones:3002;
        }

        location = /sesion {
            client_max_body_size 2k;
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://frontend-cine:3000;
        }

        location = /api/asientos/health {
            proxy_pass http://servicio-asientos:3001;
        }

        # Los servicios verifican la firma HS256 y el vencimiento del JWT.
        location /api/funciones {
            default_type application/json;
            if ($token_presente = 0) {
                return 401 '{"codigo":"NO_AUTENTICADO","mensaje":"Token ausente o inválido."}';
            }
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://servicio-funciones:3002;
        }

        location /api/asientos {
            default_type application/json;
            if ($token_presente = 0) {
                return 401 '{"codigo":"NO_AUTENTICADO","mensaje":"Token ausente o inválido."}';
            }
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://servicio-asientos:3001;
        }

        location /api/metricas {
            default_type application/json;
            if ($token_presente = 0) {
                return 401 '{"codigo":"NO_AUTENTICADO","mensaje":"Token ausente o inválido."}';
            }
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://servicio-asientos:3001;
        }

        location /ws/sala/ {
            proxy_pass http://servicio-asientos:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering off;
            # Los errores internos de Nginx pueden incluir la URL completa.
            error_log /var/log/nginx/error.log crit;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        error_page 502 503 504 =503 @servicio_caido;
        location @servicio_caido {
            default_type application/json;
            return 503 '{"codigo":"SERVICIO_NO_DISPONIBLE","mensaje":"El servicio no está disponible en este momento."}';
        }

        error_page 429 @demasiadas_solicitudes;
        location @demasiadas_solicitudes {
            default_type application/json;
            return 429 '{"codigo":"LIMITE_EXCEDIDO","mensaje":"Demasiadas solicitudes. Intentá de nuevo en unos segundos."}';
        }
    }
}
